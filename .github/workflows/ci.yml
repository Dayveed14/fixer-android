name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    name: Tests & web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  apk:
    name: Debug APK
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web app and copy it into the Android project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://fixer-backend-7mng.onrender.com' }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ vars.VITE_PAYSTACK_PUBLIC_KEY }}
        run: npm run build && npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fixer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
